[project]
name = "meshcanvas"
version = "0.1.0"
description = "Meshtastic position injector for NodeDB resilience research on owned meshes"
requires-python = ">=3.11"
dependencies = [
    "meshtastic>=2.5",
    "cryptography>=42",
    "pillow>=10",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyserial>=3.5",
    "paho-mqtt>=2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
meshcanvas = "meshcanvas.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshcanvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
